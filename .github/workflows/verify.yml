name: Offline port checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  preservation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/generate-pstack-harness-trees.py --check
